[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-music-player-cthulhu"
version = "1.0.10"
authors = [
  { name="Thiago Mendonça", email="tfariamendonca@gmail.com" },
]
description = "A lightweight terminal music player with mpv engine and auto-setup"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "yt-dlp>=2024.03.10",
    "windows-curses; sys_platform == 'win32'",
    "py7zr; sys_platform == 'win32'",
    "PyQt6>=6.4.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
musicplayer = "musicplayer.launcher:launch"
musicplayer-gui = "musicplayer.gui:main"
freethullu-player = "musicplayer.launcher:launch"

[tool.setuptools]
packages = ["musicplayer"]
include-package-data = true

[tool.setuptools.package-data]
musicplayer = ["assets/*.png"]